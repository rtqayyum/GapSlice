name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run checks
        env:
          OMP_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short | tee pytest.log
      - name: Report failing checks
        if: failure()
        run: grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error::/' || true
